# lefthook.yml — install once per clone from the repo root: `lefthook install`
# Needs: brew install lefthook gitleaks
#
# Showcase repo: secrets and personal context must never reach it. .gitignore is
# the first layer; these hooks are the second, stopping either before it leaves the Mac.
pre-commit:
  commands:
    private-terms:
      # Personal context (names, a document's subject) never reaches git. The checker and
      # its term list live in ~/.config/git/, outside every repo; skipped where absent.
      run: 'c="$HOME/.config/git/private-terms-check"; [ ! -x "$c" ] || "$c" staged'
    gitleaks:
      run: gitleaks git --staged --redact --no-banner --verbose
    no-secret-files:
      glob: ["*.env", "**/*.env", ".env", "**/.env", "*.pem", "**/*.pem", "*.key", "**/*.key", "*.tfstate", "**/*.tfstate"]
      run: "echo 'Refusing to commit secret-bearing file(s): {staged_files}' && exit 1"
pre-push:
  commands:
    private-terms:
      # Every commit not on GitHub yet, with its message: catches old history merged back
      # from a stale clone, which the commit checks never see.
      run: 'c="$HOME/.config/git/private-terms-check"; [ ! -x "$c" ] || "$c" push'
    gitleaks-history:
      run: gitleaks git --redact --no-banner --verbose

commit-msg:
  commands:
    private-terms:
      run: 'c="$HOME/.config/git/private-terms-check"; [ ! -x "$c" ] || "$c" msg {1}'
